<style>
  :root {
    --sans: "Inter", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --gap: 24px;
    --pad: clamp(16px, 4vw, 48px);
  }
  html[data-theme="light"] {
    --bg: #FAF9F6; --surface: #F2F0EA; --fg: #141416; --muted: #6B6A65; --line: #DEDBD3; --strong: #141416;
    --a: var(--al); color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #141416; --surface: #1B1B1E; --fg: #ECEAE5; --muted: #8E8D88; --line: #2C2C30; --strong: #ECEAE5;
    --a: var(--ad); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 16px; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; transition: background-color .25s ease, color .25s ease;
  }
  *, *::before, *::after { transition: border-color .25s ease, background-color .25s ease; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 1px solid var(--strong); outline-offset: 2px; }
  .label { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 var(--pad); }
  b { font-weight: 600; }

  /* math */
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .88em; margin: 0 .12em; line-height: 1.15; }
  .frac > span { padding: 0 .2em; }
  .frac > span:first-child { border-bottom: 1px solid currentColor; }
  sup, sub { font-size: .72em; line-height: 0; }

  /* header */
  header.top { border-bottom: 1px solid var(--strong); position: relative; }
  header.top::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 2px; width: var(--p, 0%); background: var(--a); transition: width .35s ease; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .back:hover { color: var(--fg); }
  .toggle {
    display: inline-flex; align-items: center; gap: 10px; background: transparent; border: 1px solid var(--line);
    padding: 6px 10px 6px 8px; cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
  }
  .toggle:hover { border-color: var(--strong); }
  .switch { position: relative; width: 30px; height: 16px; border: 1px solid var(--strong); }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: var(--strong); transition: transform .25s ease; }
  html[data-theme="dark"] .switch::after { transform: translateX(14px); }
  .masthead { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--gap); padding: clamp(28px, 5vw, 56px) 0 clamp(20px, 3vw, 32px); align-items: end; }
  .masthead .t { grid-column: span 8; }
  .code { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .code i, .sq { width: 8px; height: 8px; background: var(--a); display: inline-block; flex: none; }
  h1 { margin: 0; font-size: clamp(32px, 5.6vw, 64px); line-height: 1; letter-spacing: -.035em; font-weight: 700; }
  .subtitle { margin-top: 10px; color: var(--muted); }
  .meta { grid-column: span 4; display: grid; gap: 6px; }
  .meta-row { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 6px; }
  .meta-row span:last-child { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* layout */
  .layout { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--gap); padding: 32px 0 64px; }
  aside.side { grid-column: span 3; }
  main.content { grid-column: span 9; min-width: 0; }
  .side-inner { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; padding-right: 4px; }
  details.toc > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--strong); padding: 10px 0; }
  details.toc > summary::-webkit-details-marker { display: none; }
  details.toc > summary .chev { font-family: var(--mono); color: var(--muted); }
  details.toc[open] > summary .chev { transform: rotate(180deg); }
  .toc-group { margin-top: 14px; }
  .toc-group .label { display: block; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .toc a { display: grid; grid-template-columns: 26px 1fr 10px; gap: 8px; align-items: center; padding: 6px 0 6px 8px; border-left: 2px solid transparent; font-size: 14px; color: var(--muted); }
  .toc a:hover { color: var(--fg); }
  .toc a.active { color: var(--fg); border-left-color: var(--a); }
  .toc a .n { font-family: var(--mono); font-size: 12px; }
  .toc a .st { width: 8px; height: 8px; border: 1px solid var(--line); }
  .toc a.mastered .st { background: var(--a); border-color: var(--a); }
  .side-tools { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 12px; }
  .switch-row { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .switch-row input { position: absolute; opacity: 0; pointer-events: none; }
  .switch-row .switch { flex: none; }
  .switch-row input:checked + .switch::after { transform: translateX(14px); }
  .switch-row input:focus-visible + .switch { outline: 1px solid var(--strong); outline-offset: 2px; }
  .link-btn { border: 0; background: transparent; padding: 0; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; text-align: left; }
  .link-btn:hover { color: var(--fg); }

  /* topic */
  .topic { border-top: 1px solid var(--strong); padding: 14px 0 48px; }
  .t-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .t-meta .label { display: inline-flex; align-items: center; gap: 8px; }
  .t-title { margin: 14px 0 0; font-size: clamp(24px, 3.2vw, 34px); line-height: 1.12; letter-spacing: -.025em; font-weight: 700; }
  .master {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: 1px solid var(--line); padding: 5px 10px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; background: transparent;
  }
  .master:hover { border-color: var(--strong); }
  .master .box { width: 12px; height: 12px; border: 1px solid var(--strong); display: inline-grid; place-items: center; }
  .master[aria-pressed="true"] { border-color: var(--a); }
  .master[aria-pressed="true"] .box { background: var(--a); border-color: var(--a); }
  .konsep { margin: 16px 0 0; max-width: 72ch; }
  .sub { display: flex; align-items: baseline; gap: 10px; margin: 32px 0 12px; font-size: 13px; font-family: var(--mono); font-weight: 400; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .sub .k { color: var(--fg); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  .two > div { min-width: 0; }
  ol.penting { margin: 0; padding: 0; list-style: none; counter-reset: p; }
  ol.penting li { counter-increment: p; display: grid; grid-template-columns: 26px 1fr; padding: 8px 0; border-bottom: 1px solid var(--line); }
  ol.penting li::before { content: counter(p, decimal-leading-zero); font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 3px; }
  .rumus { display: grid; gap: 8px; }
  .rumus .f { border: 1px solid var(--line); border-left: 2px solid var(--a); padding: 10px 14px; font-size: 16px; overflow-x: auto; white-space: nowrap; }
  ul.ket { margin: 12px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
  ul.ket li { padding: 3px 0 3px 14px; position: relative; }
  ul.ket li::before { content: ""; position: absolute; left: 0; top: .8em; width: 6px; height: 1px; background: var(--muted); }

  .ex-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
  .ex { display: grid; grid-template-columns: 56px 1fr; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .ex-n { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 3px; }
  .ex-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); padding: 2px 7px; color: var(--muted); }
  .tag.school { color: var(--fg); border-color: var(--a); }
  .ex-soal { font-weight: 500; }
  .cara { margin-top: 10px; }
  .steps { margin: 6px 0 0; padding: 10px 0 10px 14px; border-left: 1px solid var(--line); font-family: var(--mono); font-size: 13.5px; line-height: 1.9; overflow-x: auto; }
  .steps div { white-space: pre-wrap; }
  .jawab { margin-top: 10px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .jawab .v { font-weight: 600; border-bottom: 2px solid var(--a); padding-bottom: 1px; }

  ol.lat { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  ol.lat li { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
  ol.lat .n { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 3px; }
  .kbtn { border: 1px solid var(--line); background: transparent; padding: 3px 9px; cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .kbtn:hover { border-color: var(--strong); }
  .kunci { display: none; margin-top: 6px; font-family: var(--mono); font-size: 13.5px; }
  .kunci .v { border-bottom: 2px solid var(--a); padding-bottom: 1px; }
  .kunci .note { display: block; margin-top: 6px; font-family: var(--sans); font-size: 13px; color: var(--muted); border-left: 2px solid var(--muted); padding-left: 10px; }
  li.open .kunci, body.show-keys .kunci { display: block; }
  body.show-keys .kbtn { visibility: hidden; }

  ul.tips { margin: 0; padding: 0; list-style: none; }
  ul.tips li { padding: 8px 0 8px 18px; border-bottom: 1px solid var(--line); position: relative; }
  ul.tips li::before { content: "—"; position: absolute; left: 0; color: var(--muted); }
  .trik { border: 1px solid var(--line); padding: 14px 16px; }
  .trik .label { display: block; margin-bottom: 6px; color: var(--fg); }
  .ingat { margin-top: 20px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: baseline; border-top: 1px solid var(--strong); border-bottom: 1px solid var(--strong); padding: 12px 0; }
  .ingat .label { color: var(--fg); display: inline-flex; gap: 8px; align-items: center; }

  /* bonus */
  .cheat { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .cheat > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 16px; min-width: 0; }
  .cheat h4 { margin: 0 0 8px; font-family: var(--mono); font-size: 12px; font-weight: 400; letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
  .cheat .ln { font-size: 14px; padding: 3px 0; overflow-wrap: anywhere; }
  .cheat .ln.h { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .cheat .ln.h:first-of-type { margin-top: 0; border-top: 0; padding-top: 0; }
  table.rekap { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.rekap th { text-align: left; font-family: var(--mono); font-size: 11px; font-weight: 400; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--strong); padding: 8px 10px 8px 0; }
  table.rekap td { border-bottom: 1px solid var(--line); padding: 10px 10px 10px 0; vertical-align: top; }
  table.rekap td.no { font-family: var(--mono); color: var(--muted); width: 40px; }
  table.rekap td.cara { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  table.rekap td.ans { font-weight: 600; white-space: nowrap; }
  table.rekap a.go { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  table.rekap a.go:hover { color: var(--fg); }
  .table-wrap { overflow-x: auto; }

  footer { border-top: 1px solid var(--strong); padding: 18px 0 32px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  @media (max-width: 960px) {
    aside.side, main.content, .masthead .t, .meta { grid-column: 1 / -1; }
    .side-inner { position: static; max-height: none; overflow: visible; }
    .cheat { grid-template-columns: 1fr; }
  }
  @media (max-width: 680px) {
    body { font-size: 14px; }
    .two { grid-template-columns: 1fr; }
    .ex { grid-template-columns: 1fr; gap: 4px; }
    ol.lat li { grid-template-columns: 26px 1fr; }
    ol.lat .kbtn { grid-column: 2; justify-self: start; }
    table.rekap td.cara, table.rekap th.cara { display: none; }
    .rumus .f { font-size: 15px; }
  }
  @media print {
    aside.side, .bar, .kbtn, .master, footer { display: none !important; }
    .kunci { display: block !important; }
    main.content { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="bar">
      <a class="back label" href="index.html">&larr; Indeks</a>
      <button class="toggle" id="theme-toggle" type="button" aria-label="Ganti mode terang/gelap">
        <span class="switch" aria-hidden="true"></span><span id="theme-text">Terang</span>
      </button>
    </div>
    <div class="masthead">
      <div class="t">
        <div class="label code"><i></i><span id="m-code"></span></div>
        <h1 id="m-name"></h1>
        <div class="subtitle" id="m-sub"></div>
      </div>
      <div class="meta">
        <div class="meta-row"><span class="label">Bab / topik</span><span id="m-count">—</span></div>
        <div class="meta-row"><span class="label">Topik dikuasai</span><span id="m-done">0/0</span></div>
        <div class="meta-row"><span class="label">Soal sekolah</span><span id="m-school">—</span></div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <aside class="side">
      <div class="side-inner">
        <details class="toc" id="toc-box">
          <summary><span class="label">Daftar isi</span><span class="chev">&darr;</span></summary>
          <nav class="toc" id="toc" aria-label="Daftar topik"></nav>
        </details>
        <div class="side-tools">
          <label class="switch-row">
            <span class="label">Tampilkan semua kunci</span>
            <input type="checkbox" id="show-keys"><span class="switch" aria-hidden="true"></span>
          </label>
          <button class="link-btn" id="reset" type="button">Reset tanda dikuasai</button>
        </div>
      </div>
    </aside>

    <main class="content" id="content"></main>
  </div>

  <footer>
    <span class="label">Portal Belajar ASAS / <span id="f-code"></span></span>
    <a class="label" href="#top">Ke atas &uarr;</a>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var root = document.documentElement;
  root.style.setProperty('--al', MAPEL.al);
  root.style.setProperty('--ad', MAPEL.ad);
  var $ = function (id) { return document.getElementById(id); };

  $('m-code').textContent = MAPEL.num + ' / ' + MAPEL.code;
  $('f-code').textContent = MAPEL.code;
  $('m-name').textContent = MAPEL.name;
  $('m-sub').textContent = MAPEL.sub;

  /* ---------- formatter ---------- */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmt(s) {
    var h = esc(s);
    h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    h = h.replace(/\^\{([^{}]+)\}/g, '<sup>$1</sup>').replace(/\^([0-9a-zA-Z]+)/g, '<sup>$1</sup>');
    h = h.replace(/_\{([^{}]+)\}/g, '<sub>$1</sub>').replace(/_([0-9a-zA-Z]+)/g, '<sub>$1</sub>');
    h = h.replace(/\{([^{}|]+)\|([^{}|]+)\}/g, '<span class="frac"><span>$1</span><span>$2</span></span>');
    return h;
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  /* ---------- state ---------- */
  var KEY = 'asas.kisi.' + MAPEL.id;
  var mastered = {};
  try { mastered = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  if (typeof mastered !== 'object' || Array.isArray(mastered)) mastered = {};
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mastered)); } catch (e) {} }

  /* ---------- render content ---------- */
  var html = [];
  TOPIK.forEach(function (t, i) {
    var h = '<section class="topic" id="' + t.id + '">';
    h += '<div class="t-meta"><span class="label"><span class="sq"></span>' + pad(i + 1) + ' &middot; Bab ' + t.bab + ' — ' + esc(BAB[t.bab]) + '</span>';
    h += '<button type="button" class="master" data-id="' + t.id + '" aria-pressed="false"><span class="box"></span><span>Dikuasai</span></button></div>';
    h += '<h2 class="t-title">' + fmt(t.judul) + '</h2>';
    if (t.konsep) h += '<p class="konsep">' + fmt(t.konsep) + '</p>';

    h += '<div class="two">';
    h += '<div><h3 class="sub"><span class="k">A</span> Catatan penting</h3><ol class="penting">' +
      t.penting.map(function (p) { return '<li><span>' + fmt(p) + '</span></li>'; }).join('') + '</ol></div>';
    h += '<div><h3 class="sub"><span class="k">B</span> Rumus inti</h3><div class="rumus">' +
      t.rumus.map(function (r) { return '<div class="f">' + fmt(r) + '</div>'; }).join('') + '</div>';
    if (t.ket && t.ket.length) h += '<ul class="ket">' + t.ket.map(function (k) { return '<li>' + fmt(k) + '</li>'; }).join('') + '</ul>';
    h += '</div></div>';

    h += '<h3 class="sub"><span class="k">C</span> Contoh &amp; pembahasan</h3><div class="ex-list">';
    t.contoh.forEach(function (c, j) {
      h += '<div class="ex"><div class="ex-n">C' + (j + 1) + '</div><div>';
      var tags = '';
      if (c.sekolah) tags += '<span class="tag school"><span class="sq"></span>Soal sekolah No. ' + c.sekolah + '</span>';
      if (c.label) tags += '<span class="tag">' + esc(c.label) + '</span>';
      if (tags) h += '<div class="ex-tags">' + tags + '</div>';
      h += '<div class="ex-soal">' + fmt(c.soal) + '</div>';
      h += '<div class="cara label">Jawab' + (c.cara ? ' — ' + fmt(c.cara) : '') + '</div>';
      h += '<div class="steps">' + c.langkah.map(function (l) { return '<div>' + fmt(l) + '</div>'; }).join('') + '</div>';
      h += '<div class="jawab"><span class="label">Jawaban</span><span class="v">' + fmt(c.jawab) + '</span></div>';
      h += '</div></div>';
    });
    h += '</div>';

    h += '<h3 class="sub"><span class="k">D</span> Latihan soal</h3><ol class="lat">';
    t.latihan.forEach(function (l, j) {
      h += '<li><span class="n">' + pad(j + 1) + '</span><div><div>' + fmt(l.s) + '</div>' +
        '<div class="kunci"><span class="label">Kunci&nbsp;</span> <span class="v">' + fmt(l.k) + '</span>' +
        (l.note ? '<span class="note">' + fmt(l.note) + '</span>' : '') + '</div></div>' +
        '<button type="button" class="kbtn">Kunci</button></li>';
    });
    h += '</ol>';

    h += '<div class="two">';
    h += '<div><h3 class="sub"><span class="k">E</span> Tips cepat</h3><ul class="tips">' +
      t.tips.map(function (p) { return '<li>' + fmt(p) + '</li>'; }).join('') + '</ul></div>';
    h += '<div><h3 class="sub"><span class="k">F</span> ' + esc(t.trik.j) + '</h3><div class="trik">' + fmt(t.trik.isi) + '</div></div>';
    h += '</div>';
    h += '<div class="ingat"><span class="label"><span class="sq"></span>Ingat</span><span>' + fmt(t.ingat) + '</span></div>';
    h += '</section>';
    html.push(h);
  });

  // bonus
  var b = '<section class="topic" id="bonus">';
  b += '<div class="t-meta"><span class="label"><span class="sq"></span>Bonus — Rangkuman pamungkas</span></div>';
  b += '<h2 class="t-title">Cheat Sheet Kebut 10 Menit</h2>';
  b += '<p class="konsep">Baca halaman ini 10 menit sebelum masuk ruang ujian. Semua rumus inti 3 bab dan kunci 14 soal sekolah ada di sini.</p>';
  b += '<h3 class="sub"><span class="k">A</span> Ringkasan rumus wajib hafal</h3><div class="cheat">';
  CHEAT.forEach(function (c) {
    b += '<div><h4><span class="sq"></span>' + esc(c.bab) + '</h4>' + c.isi.map(function (l) {
      var head = /^\*\*.*\*\*$/.test(l);
      return '<div class="ln' + (head ? ' h' : '') + '">' + fmt(l) + '</div>';
    }).join('') + '</div>';
  });
  b += '</div>';
  b += '<h3 class="sub"><span class="k">B</span> Rekap kunci 14 soal latihan resmi sekolah</h3><div class="table-wrap"><table class="rekap"><thead><tr><th>No</th><th>Soal</th><th class="cara">Cara</th><th>Jawaban</th><th></th></tr></thead><tbody>';
  REKAP.forEach(function (r) {
    b += '<tr><td class="no">' + pad(r.no) + '</td><td>' + fmt(r.soal) + '</td><td class="cara">' + fmt(r.cara) + '</td><td class="ans">' + fmt(r.jawab) + '</td><td><a class="go" href="#' + r.t + '">Topik</a></td></tr>';
  });
  b += '</tbody></table></div></section>';
  html.push(b);
  $('content').innerHTML = html.join('');

  /* ---------- TOC ---------- */
  var toc = '';
  Object.keys(BAB).forEach(function (k) {
    toc += '<div class="toc-group"><span class="label">Bab ' + k + ' — ' + esc(BAB[k]) + '</span>';
    TOPIK.forEach(function (t, i) {
      if (String(t.bab) !== k) return;
      toc += '<a href="#' + t.id + '" data-id="' + t.id + '"><span class="n">' + pad(i + 1) + '</span><span>' + fmt(t.judul) + '</span><span class="st"></span></a>';
    });
    toc += '</div>';
  });
  toc += '<div class="toc-group"><span class="label">Bonus</span><a href="#bonus" data-id="bonus"><span class="n">++</span><span>Cheat sheet &amp; rekap</span><span></span></a></div>';
  $('toc').innerHTML = toc;
  var tocBox = $('toc-box');
  if (window.matchMedia('(min-width: 961px)').matches) tocBox.open = true;
  $('toc').addEventListener('click', function (e) {
    if (e.target.closest('a') && !window.matchMedia('(min-width: 961px)').matches) tocBox.open = false;
  });

  /* ---------- meta ---------- */
  var schoolCount = 0;
  TOPIK.forEach(function (t) { t.contoh.forEach(function (c) { if (c.sekolah) schoolCount++; }); });
  $('m-count').textContent = pad(Object.keys(BAB).length) + ' / ' + pad(TOPIK.length);
  $('m-school').textContent = pad(schoolCount);

  function refresh() {
    var n = 0;
    TOPIK.forEach(function (t) {
      var on = !!mastered[t.id];
      if (on) n++;
      var btn = document.querySelector('.master[data-id="' + t.id + '"]');
      btn.setAttribute('aria-pressed', String(on));
      var a = document.querySelector('.toc a[data-id="' + t.id + '"]');
      if (a) a.classList.toggle('mastered', on);
    });
    $('m-done').textContent = n + '/' + TOPIK.length;
    $('top').style.setProperty('--p', (TOPIK.length ? n / TOPIK.length * 100 : 0) + '%');
  }

  /* ---------- events ---------- */
  $('content').addEventListener('click', function (e) {
    var m = e.target.closest('.master');
    if (m) {
      var id = m.getAttribute('data-id');
      if (mastered[id]) delete mastered[id]; else mastered[id] = 1;
      save(); refresh(); return;
    }
    var k = e.target.closest('.kbtn');
    if (k) {
      var li = k.closest('li');
      li.classList.toggle('open');
      k.textContent = li.classList.contains('open') ? 'Tutup' : 'Kunci';
    }
  });

  var showKeys = $('show-keys');
  try { showKeys.checked = localStorage.getItem('asas.showKeys') === '1'; } catch (e) {}
  function applyKeys() { document.body.classList.toggle('show-keys', showKeys.checked); }
  showKeys.addEventListener('change', function () {
    try { localStorage.setItem('asas.showKeys', showKeys.checked ? '1' : '0'); } catch (e) {}
    applyKeys();
  });

  $('reset').addEventListener('click', function () {
    if (confirm('Hapus semua tanda "dikuasai" untuk ' + MAPEL.name + '?')) { mastered = {}; save(); refresh(); }
  });

  /* ---------- active section ---------- */
  if ('IntersectionObserver' in window) {
    var links = {};
    document.querySelectorAll('.toc a').forEach(function (a) { links[a.getAttribute('data-id')] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          Object.keys(links).forEach(function (k) { links[k].classList.remove('active'); });
          var a = links[en.target.id]; if (a) a.classList.add('active');
        }
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('section.topic').forEach(function (s) { io.observe(s); });
  }

  /* ---------- theme ---------- */
  function themeLabel() {
    var dark = root.getAttribute('data-theme') === 'dark';
    $('theme-text').textContent = dark ? 'Gelap' : 'Terang';
    $('theme-toggle').setAttribute('aria-pressed', String(dark));
  }
  $('theme-toggle').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('asas.theme', next); } catch (e) {}
    themeLabel();
  });

  applyKeys();
  themeLabel();
  refresh();
})();
</script>
</body>
</html>
