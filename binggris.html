<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahasa Inggris — Portal Belajar ASAS</title>

<!-- =====================================================================
     KISI-KISI — EDIT DI SINI SAJA
     Setiap bab = satu objek { bab, poin, catatan }.
     ===================================================================== -->
<script>
const KISI = [
  {
    bab: "Contoh: Judul Bab 1",
    poin: [
      "Contoh indikator: menjelaskan konsep ...",
      "Contoh indikator: menghitung / menganalisis ..."
    ],
    catatan: "Opsional. Tulis rumus atau poin penting di sini."
  },
  {
    bab: "Contoh: Judul Bab 2",
    poin: [
      "Indikator pertama",
      "Indikator kedua",
      "Indikator ketiga"
    ]
  }
];
</script>
<!-- ===================================================================== -->

<script>
  const MAPEL = { id: "big", code: "B.ING", num: "09", name: "Bahasa Inggris", al: "#3B4859", ad: "#9DAABD" };
  (function () {
    try {
      var t = localStorage.getItem('asas.theme');
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sans: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --pad: clamp(14px, 4vw, 32px);
  }
  html[data-theme="light"] {
    --bg: #F3F5FA; --paper: #FFFFFF; --surface: #F6F7FB; --fg: #171B2E; --muted: #5B6278; --line: #DFE3EE;
    --a: var(--al); --tip: #13865A; color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #0E111B; --paper: #171B28; --surface: #1D2232; --fg: #E8EBF4; --muted: #A0A7BA; --line: #2A3042;
    --a: var(--ad); --tip: #5FD69C; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; transition: background-color .25s ease, color .25s ease; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
  .label { font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 var(--pad); }

  .topnav { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1.5px solid var(--line); }
  .topnav::after { content: ""; position: absolute; left: 0; bottom: -1.5px; height: 3px; width: var(--p, 0%); background: var(--a); transition: width .35s ease; }
  .nav-in { max-width: 860px; margin: 0 auto; padding: 10px var(--pad); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--paper); border: 1.5px solid var(--line); font-size: 13px; font-weight: 700; }
  .pill:hover { border-color: var(--a); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border: 1.5px solid var(--line); padding: 5px 10px 5px 6px; border-radius: 999px; cursor: pointer; font-size: 12.5px; font-weight: 700; }
  .switch { position: relative; width: 30px; height: 18px; border-radius: 999px; background: var(--line); flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .25s ease; }
  html[data-theme="dark"] .toggle .switch { background: var(--a); }
  html[data-theme="dark"] .toggle .switch::after { transform: translateX(12px); }

  .hero { position: relative; overflow: hidden; margin-top: 22px; border-radius: 22px; background: var(--paper); border: 1.5px solid var(--line); padding: clamp(22px, 4vw, 34px); }
  .hero::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--a); }
  .code { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, var(--a) 13%, var(--paper)); color: var(--a); font-family: var(--mono); font-size: 12px; font-weight: 700; margin-bottom: 10px; }
  h1 { margin: 0; font-size: clamp(30px, 5vw, 48px); line-height: 1.06; letter-spacing: -.03em; font-weight: 800; }
  .hero-stats { margin-top: 16px; display: flex; gap: 18px; flex-wrap: wrap; padding-top: 14px; border-top: 1.5px solid var(--line); font-size: 13.5px; color: var(--muted); font-weight: 600; }
  .hero-stats b { color: var(--fg); }

  .tools { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin: 20px 0 16px; flex-wrap: wrap; }
  .search { flex: 1 1 240px; display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--paper); padding: 0 12px; }
  .search svg { width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 1.5; flex: none; }
  .search input { border: 0; background: transparent; padding: 10px 0; outline: none; width: 100%; }
  .search input::placeholder { color: var(--muted); }
  .link-btn { border: 0; background: transparent; padding: 0; cursor: pointer; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .link-btn:hover { color: var(--fg); }

  .bab { border-radius: 20px; background: var(--paper); border: 1.5px solid var(--line); border-top: 5px solid var(--a); padding: 20px; margin-bottom: 16px; }
  .bab-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .bab h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.015em; }
  .bab-prog { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--a); white-space: nowrap; }
  ul.poin { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.poin li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface); }
  .chk { appearance: none; -webkit-appearance: none; margin: 2px 0 0; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--muted); background: var(--paper); cursor: pointer; display: grid; place-items: center; }
  .chk::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
  .chk:checked { background: var(--tip); border-color: var(--tip); }
  .chk:checked::after { opacity: 1; }
  ul.poin label { cursor: pointer; overflow-wrap: anywhere; }
  li.done label { color: var(--muted); text-decoration: line-through; }
  .catatan { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border-left: 4px solid var(--a); background: color-mix(in srgb, var(--a) 8%, var(--paper)); font-size: 14px; white-space: pre-line; }
  .catatan .label { display: block; margin-bottom: 4px; color: var(--a); font-weight: 700; }
  .empty { padding: 28px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 18px; background: var(--paper); }

  footer { border-top: 1.5px solid var(--line); margin-top: 32px; padding: 18px 0 32px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<nav class="topnav" id="top">
  <div class="nav-in">
    <a class="pill" href="index.html">&larr; Indeks</a>
    <button class="toggle" id="theme-toggle" type="button" aria-label="Ganti mode terang/gelap">
      <span class="switch" aria-hidden="true"></span><span id="theme-text">Terang</span>
    </button>
  </div>
</nav>

<div class="wrap">
  <header class="hero">
    <div class="code"><span id="m-code"></span></div>
    <h1 id="m-name"></h1>
    <div class="hero-stats">
      <span>Bab: <b id="m-bab">0</b></span>
      <span>Dikuasai: <b id="m-done">0/0</b> (<b id="m-pct">0%</b>)</span>
    </div>
  </header>

  <main>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="q" type="search" placeholder="Cari bab atau indikator" aria-label="Cari">
      </label>
      <button class="link-btn" id="reset" type="button">Reset centang mapel ini</button>
    </div>
    <div id="list"></div>
  </main>

  <footer>
    <span class="label">Portal Belajar ASAS / <span id="f-code"></span></span>
    <a class="label" href="#top">Ke atas &uarr;</a>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var root = document.documentElement;
  root.style.setProperty('--al', MAPEL.al);
  root.style.setProperty('--ad', MAPEL.ad);
  document.getElementById('m-code').textContent = MAPEL.num + ' / ' + MAPEL.code;
  document.getElementById('f-code').textContent = MAPEL.code;
  document.getElementById('m-name').textContent = MAPEL.name;

  var KEY = 'asas.kisi.' + MAPEL.id;
  var done = {};
  try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }
  function pid(bab, poin) { return bab + '::' + poin; }

  var list = document.getElementById('list');
  var q = document.getElementById('q');

  function render() {
    var term = q.value.trim().toLowerCase();
    list.innerHTML = '';
    var shown = 0;

    KISI.forEach(function (b, i) {
      var poin = b.poin || [];
      var matchBab = !term || b.bab.toLowerCase().indexOf(term) !== -1;
      var visible = matchBab ? poin : poin.filter(function (p) { return p.toLowerCase().indexOf(term) !== -1; });
      if (!matchBab && !visible.length) return;
      shown++;

      var d = poin.filter(function (p) { return done[pid(b.bab, p)]; }).length;
      var sec = document.createElement('section');
      sec.className = 'bab';

      var head = document.createElement('div'); head.className = 'bab-head';
      var h2 = document.createElement('h2'); h2.textContent = String(i + 1).padStart(2, '0') + '. ' + b.bab;
      var pr = document.createElement('span'); pr.className = 'bab-prog'; pr.textContent = d + '/' + poin.length;
      head.appendChild(h2); head.appendChild(pr); sec.appendChild(head);

      var ul = document.createElement('ul'); ul.className = 'poin';
      visible.forEach(function (p, j) {
        var id = pid(b.bab, p);
        var li = document.createElement('li'); if (done[id]) li.className = 'done';
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.className = 'chk'; cb.id = 'p' + i + '-' + j; cb.checked = !!done[id];
        cb.addEventListener('change', function () {
          if (cb.checked) done[id] = 1; else delete done[id];
          save(); render();
        });
        var lb = document.createElement('label'); lb.htmlFor = cb.id; lb.textContent = p;
        li.appendChild(cb); li.appendChild(lb); ul.appendChild(li);
      });
      sec.appendChild(ul);

      if (b.catatan) {
        var c = document.createElement('div'); c.className = 'catatan';
        var cl = document.createElement('span'); cl.className = 'label'; cl.textContent = 'Catatan';
        c.appendChild(cl); c.appendChild(document.createTextNode(b.catatan));
        sec.appendChild(c);
      }
      list.appendChild(sec);
    });

    if (!shown) {
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = KISI.length ? 'Tidak ada hasil untuk "' + q.value + '".' : 'Belum ada kisi-kisi.';
      list.appendChild(e);
    }
    summary();
  }

  function summary() {
    var total = 0, d = 0;
    KISI.forEach(function (b) { (b.poin || []).forEach(function (p) { total++; if (done[pid(b.bab, p)]) d++; }); });
    var pct = total ? Math.round(d / total * 100) : 0;
    document.getElementById('m-bab').textContent = String(KISI.length).padStart(2, '0');
    document.getElementById('m-done').textContent = d + '/' + total;
    document.getElementById('m-pct').textContent = pct + '%';
    document.getElementById('top').style.setProperty('--p', pct + '%');
  }

  q.addEventListener('input', render);
  document.getElementById('reset').addEventListener('click', function () {
    if (confirm('Hapus semua centang untuk ' + MAPEL.name + '?')) { done = {}; save(); render(); }
  });

  function themeLabel() {
    var dark = root.getAttribute('data-theme') === 'dark';
    document.getElementById('theme-text').textContent = dark ? 'Gelap' : 'Terang';
    document.getElementById('theme-toggle').setAttribute('aria-pressed', String(dark));
  }
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('asas.theme', next); } catch (e) {}
    themeLabel();
  });

  themeLabel();
  render();
})();
</script>
</body>
</html>
